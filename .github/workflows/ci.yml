name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Formatting happens in the pre-commit hook; this only catches commits that skipped it
      - name: Check formatting
        run: uv run ruff format --check

      - name: Run tests
        run: uv run pytest
