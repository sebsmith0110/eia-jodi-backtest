name: Refresh data

# Downloads JODI and EIA, rebuilds the snapshot and commits it only if the
# numbers changed. The commit redeploys the Streamlit Cloud app.
on:
  schedule:
    # Daily 07:00 UTC. Releases land on different days (EIA weekly on
    # Wednesdays, EIA monthly at month end, JODI mid-month), so daily
    # catches each one within a day; most runs find nothing and commit nothing.
    - cron: "0 7 * * *"
  push:
    branches: [main]
    paths-ignore: ["data/snapshot/**"]
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Download JODI and EIA
        run: uv run python -m etl.extract

      - name: Rebuild snapshot
        run: uv run python -m etl.snapshot

      - name: Commit snapshot if it changed
        run: |
          git add -A data/snapshot
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh snapshot ($(ls data/snapshot | sed 's/clean_//; s/.csv//'))"
          # Someone may have pushed while this ran
          git pull --rebase
          git push
