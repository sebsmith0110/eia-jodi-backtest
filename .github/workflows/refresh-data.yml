name: Refresh data

# Runs the full pipeline (python -m etl.run): download JODI and EIA, build the
# clean table, run the quality checks, rebuild the snapshot if the numbers changed.
# Commits the run logs every day (so the dashboard shows when data was last checked)
# and the snapshot when it changed; the commit redeploys the Streamlit Cloud app.
# Late data shows as a warning on the run's summary page and on the dashboard; a
# failed critical check fails the run, so GitHub emails you, and the snapshot is
# left as it was.
on:
  schedule:
    # Daily 07:00 UTC, before any source's release time, so each release is
    # picked up the next morning (the late-data warnings assume this).
    - cron: "0 7 * * *"
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pipeline
        run: uv run python -m etl.run

      # Runs even when the pipeline failed, so the failure is in the logs and on
      # the dashboard. The job still ends as failed.
      - name: Commit logs and snapshot
        if: always()
        run: |
          git add -A data/logs data/snapshot
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet -- data/snapshot; then
            git commit -m "data: daily check $(date -u +%Y-%m-%d)"
          else
            git commit -m "data: refresh snapshot ($(basename data/snapshot/clean_*.csv .csv | sed 's/clean_//'))"
          fi
          # Someone may have pushed while this ran
          git pull --rebase
          git push
