[project]
name = "eia-jodi-backtest"
version = "0.1.0"
description = "Backtest early EIA US crude import/export data against JODI Oil, with a scheduled ETL pipeline and a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastexcel>=0.21.0",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
